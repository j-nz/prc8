name: Temporary Knight Icon Export

on:
  push:
    branches:
      - tmp/export-knight-icon

permissions:
  contents: write

jobs:
  export-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export Knight icon as base64 text
        shell: bash
        run: |
          set -euo pipefail
          if [ -f tmp/ir_tknight.tga.b64 ]; then
            echo "Export already exists."
            exit 0
          fi
          test "$(git hash-object nwn/nwnprc/trunk/gfx/ir_tknight.tga)" = "2785680de2dcd011dc4ea7c1fecff00fed125e86"
          mkdir -p tmp
          base64 -w0 nwn/nwnprc/trunk/gfx/ir_tknight.tga > tmp/ir_tknight.tga.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/ir_tknight.tga.b64
          git commit -m "tmp: export Knight icon"
          git push origin HEAD:tmp/export-knight-icon
